<!DOCTYPE html>
<meta charset="utf-8">
<title>CSS Selectors Invalidation: :has() invalidation basic</title>
<link rel="author" title="Byungwoo Lee" href="mailto:blee@igalia.com">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<link rel="help" href="https://drafts.csswg.org/selectors/#relational">
<style>
div, main { color: grey }
.subject:has(> .child) { color: red }
.subject:has(.descendent) { color: green }
.subject:has([attrname=descendent]) { color: blue }
.subject:has(#div_descendent) { color: yellow }
.subject:has(descendent) { color: yellowgreen }
</style>
<main id=main>
  <div id=div_subject class="subject">
    <div id=div_child>
      <div id=div_grandchild></div>
    </div>
  </div>
</main>
<script>
  let grey = 'rgb(128, 128, 128)';
  let red = 'rgb(255, 0, 0)';
  let green = 'rgb(0, 128, 0)';
  let blue = 'rgb(0, 0, 255)';
  let yellow = 'rgb(255, 255, 0)';
  let yellowgreen = 'rgb(154, 205, 50)';

  function test_div(test_name, el, color) {
    test(function() {
      assert_equals(getComputedStyle(el).color, color);
    }, test_name + ': div#' + el.id + '.color');
  }

  test_div('initial_color', div_subject, grey);
  test_div('initial_color', div_child, grey);
  test_div('initial_color', div_grandchild, grey);

  div_child.classList.add('child');
  test_div('add .child to #div_child', div_subject, red);
  div_child.classList.remove('child');
  test_div('remove .child from #div_child', div_subject, grey);

  div_grandchild.classList.add('child');
  test_div('add .child to #div_grandchild', div_subject, grey);
  div_grandchild.classList.remove('child');
  test_div('remove .child from #div_grandchild', div_subject, grey);

  div_child.classList.add('descendent');
  test_div('add .descendent to #div_child', div_subject, green);
  div_child.classList.remove('descendent');
  test_div('remove .descendent from #div_child', div_subject, grey);

  div_grandchild.classList.add('descendent');
  test_div('add .descendent to #div_grandchild', div_subject, green);
  div_grandchild.classList.remove('descendent');
  test_div('remove .descendent from #div_grandchild', div_subject, grey);

  div_grandchild.setAttribute('attrname', 'descendent');
  test_div('set descendent to #div_grandchild[attrname]', div_subject, blue);
  div_grandchild.setAttribute('attrname', '');
  test_div('clear #div_grandchild[attrname]', div_subject, grey);

  div_grandchild.id = 'div_descendent';
  test_div('change #div_grandchild to #div_descendent', div_subject, yellow);
  div_descendent.id = 'div_grandchild';
  test_div('change #div_descendent to #div_grandchild', div_subject, grey);

  {
    const descendent = document.createElement('descendent');
    div_subject.appendChild(descendent);
    test_div('add descendent to #div_subject', div_subject, yellowgreen);
    div_subject.removeChild(descendent);
    test_div('remove descendent from #div_subject', div_subject, grey);
  }

  {
    const div = document.createElement('div');
    const descendent = document.createElement('descendent');
    div.appendChild(descendent);
    div_subject.appendChild(div);
    test_div('add "div > descendent" to #div_subject', div_subject, yellowgreen);
    div_subject.removeChild(div);
    test_div('remove "div > descendent" from #div_subject', div_subject, grey);
  }

  {
    const child = document.createElement('div');
    child.classList.add('child');
    div_subject.appendChild(child);
    test_div('add div.child to #div_subject', div_subject, red);
    div_subject.removeChild(child);
    test_div('remove div.child from #div_subject', div_subject, grey);
  }

  {
    const descendent = document.createElement('div');
    descendent.classList.add('descendent');
    const div = document.createElement('div');
    div.appendChild(descendent);
    div_subject.appendChild(div);
    test_div('add "div > div.descendent" to #div_subject', div_subject, green);
    div_subject.removeChild(div);
    test_div('remove "div > div.descendent" from #div_subject', div_subject, grey);
  }

  {
    const child = document.createElement('div');
    child.id = 'div_descendent';
    div_subject.appendChild(child);
    test_div('add div#div_descendent to #div_subject', div_subject, yellow);
    div_subject.removeChild(child);
    test_div('remove div#div_descendent from #div_subject', div_subject, grey);
  }

  {
    const descendent = document.createElement('div');
    descendent.id = 'div_descendent';
    const div = document.createElement('div');
    div.appendChild(descendent);
    div_subject.appendChild(div);
    test_div('add "div#div_descendent" to #div_subject', div_subject, yellow);
    div_subject.removeChild(div);
    test_div('remove "div#div_descendent" from #div_subject', div_subject, grey);
  }

  {
    const child = document.createElement('div');
    child.setAttribute('attrname', 'descendent');
    div_subject.appendChild(child);
    test_div('add div[attrname] to #div_subject', div_subject, blue);
    div_subject.removeChild(child);
    test_div('remove div[attrname] from #div_subject', div_subject, grey);
  }

  {
    const descendent = document.createElement('div');
    descendent.setAttribute('attrname', 'descendent');
    const div = document.createElement('div');
    div.appendChild(descendent);
    div_subject.appendChild(div);
    test_div('add "div > div[attrname]" to #div_subject', div_subject, blue);
    div_subject.removeChild(div);
    test_div('remove "div > div[attrname]" from #div_subject', div_subject, grey);
  }

</script>
